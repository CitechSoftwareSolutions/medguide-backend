[project]
name = "medical-knowledge-base-backend"
version = "0.1.0"
description = "Question answering over clinical guideline PDFs indexed in FAISS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "faiss-cpu",
    "fastapi[standard]>=0.141.1",
    "langgraph",
    "numpy",
    "pydantic-settings>=2.7",
    "pypdf>=6.19.0",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
]

[tool.uv]
# scikit-learn arrives through sentence-transformers. Windows Smart App Control
# blocks a native DLL in the 1.9.1 wheel (_datasets_pair.pyd), which stops the
# embedding model from loading; the 1.7 wheels pass its reputation check.
constraint-dependencies = ["scikit-learn==1.7.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
