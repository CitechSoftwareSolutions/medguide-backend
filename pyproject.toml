[project]
name = "medical-knowledge-base-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic",
    "faiss-cpu",
    "fastapi[standard]>=0.141.1",
    "langgraph",
    "numpy",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "sentence-transformers",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
