[project]
name = "medical-knowledge-base-backend"
version = "0.1.0"
description = "Question answering over clinical guideline PDFs indexed in FAISS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "faiss-cpu",
    "fastapi[standard]>=0.141.1",
    "langgraph",
    "numpy",
    "pydantic-settings>=2.7",
    "pypdf>=6.19.0",
    "sentence-transformers",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
